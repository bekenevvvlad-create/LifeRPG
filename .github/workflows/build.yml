name: Build LifeRPG APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "LifeRPG-Improved-Source.zip" ]; then
            echo "ERROR: LifeRPG-Improved-Source.zip not found!"
            echo "Repository root:"
            ls -la
            exit 1
          fi

          echo "Source archive found."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted LifeRPG_Android
          mkdir -p extracted

          unzip -q "LifeRPG-Improved-Source.zip" -d extracted

          SETTINGS_FILE="$(
            find extracted -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found in archive."
            echo "Archive contents:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Found Gradle project: $PROJECT_DIR"

          mkdir -p LifeRPG_Android
          cp -a "$PROJECT_DIR"/. LifeRPG_Android/

          if [ ! -f "LifeRPG_Android/app/build.gradle.kts" ] && \
             [ ! -f "LifeRPG_Android/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            find LifeRPG_Android -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "LifeRPG source extracted successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found at $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print -quit
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found sdkmanager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -uo pipefail

          LOG_FILE="$RUNNER_TEMP/sdk-licenses.log"

          echo "Accepting Android SDK licenses..."

          set +e

          yes 2>/dev/null | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses 2>&1 | tee "$LOG_FILE"

          PIPE_STATUS=("${PIPESTATUS[@]}")

          set -e

          YES_STATUS="${PIPE_STATUS[0]:-1}"
          SDK_STATUS="${PIPE_STATUS[1]:-1}"
          TEE_STATUS="${PIPE_STATUS[2]:-1}"

          echo "yes exit code: $YES_STATUS"
          echo "sdkmanager exit code: $SDK_STATUS"
          echo "tee exit code: $TEE_STATUS"

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "ERROR: sdkmanager failed while accepting licenses."
            echo "Full sdkmanager output:"
            cat "$LOG_FILE"
            exit "$SDK_STATUS"
          fi

          echo "Android SDK licenses accepted."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK packages installed."

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        working-directory: LifeRPG_Android
        run: gradle --version

      - name: Verify LifeRPG Gradle files
        working-directory: LifeRPG_Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) is missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) is missing."
            exit 1
          fi

          echo "Gradle project files found."

      - name: Build LifeRPG APK
        working-directory: LifeRPG_Android
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="LifeRPG_Android/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist."
            exit 1
          fi

          APK_FILE="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created."
            find "LifeRPG_Android/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: LifeRPG-debug-APK
          path: LifeRPG_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
