name: Build LifeRPG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LifeRPG
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check source archive
        run: |
          if [ ! -f "LifeRPG-Improved-Source.zip" ]; then
            echo "ERROR: LifeRPG-Improved-Source.zip not found"
            ls -la
            exit 1
          fi

          echo "Source archive found"
          unzip -l LifeRPG-Improved-Source.zip

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip -q LifeRPG-Improved-Source.zip -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found in ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          mkdir -p LifeRPG_Android
          cp -a "$PROJECT_DIR"/. LifeRPG_Android/

          echo "Project directory: $PROJECT_DIR"
          echo "Extracted project files:"
          ls -la LifeRPG_Android

      - name: Locate Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            ls -R "$ANDROID_HOME" || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Show Gradle version
        working-directory: LifeRPG_Android
        run: gradle --version

      - name: Build LifeRPG APK
        working-directory: LifeRPG_Android
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeRPG-APK
          path: LifeRPG_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
