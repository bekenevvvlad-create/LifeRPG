name: Build LifeRPG APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LifeRPG_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q LifeRPG_Android_Project.zip -d project
          WRAPPER="$(find project -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set Gradle version
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-9.6.0-bin.zip#' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeRPG-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
